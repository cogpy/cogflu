description = "Library that handles turning tile data into useful output formats, generally graphical"

// Pulls in the Java plugin
apply plugin: "java"


// Jars / projects this project depends on.
dependencies {
	compile "org.slf4j:slf4j-api:1.7.7"
	// Log4j 2.x migration: Replaced log4j:log4j:1.2.17 (CVE-2022-23305)
	compile "org.apache.logging.log4j:log4j-api:2.25.2"
	compile "org.apache.logging.log4j:log4j-core:2.25.2"
	compile "org.apache.logging.log4j:log4j-1.2-api:2.25.2"  // Bridge for Log4j 1.x API compatibility
	
	compile project(":math-utilities")
	compile project(":binning-utilities")
	
	testCompile "junit:junit:4.8.1"
	testCompile "org.mockito:mockito-all:1.9.5"
}
