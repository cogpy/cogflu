# POM Audit - Maven Build Workflow for aperture-geo

name: Maven Build - aperture-geo

on:
  push:
    branches: [ "master", "main", "develop" ]
    paths:
      - 'aperture-geo/**'
      - 'aperture-spi/**'
      - 'aperture-common/**'
      - 'pom.xml'
  pull_request:
    branches: [ "master", "main", "develop" ]
    paths:
      - 'aperture-geo/**'
      - 'aperture-spi/**'
      - 'aperture-common/**'
      - 'pom.xml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build aperture-geo
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build aperture-geo with dependencies
      run: mvn -B clean install -DskipTests -pl aperture-spi,aperture-common,aperture-geo -am
      env:
        MAVEN_OPTS: '-Xmx2048m -Xms1024m'
        
    - name: Run tests for aperture-geo
      run: mvn -B test -pl aperture-geo
      continue-on-error: false
      env:
        MAVEN_OPTS: '-Xmx2048m -Xms1024m'
        
    - name: Generate dependency tree
      run: mvn dependency:tree -DoutputFile=aperture-geo/dependency-tree.txt -pl aperture-geo
      continue-on-error: true
      
    - name: Upload dependency tree
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-tree-aperture-geo
        path: aperture-geo/dependency-tree.txt
        retention-days: 30