# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    # SSR: Build with Maven - ensure complete build before dependency analysis
    - name: Build with Maven (SSR check)
      run: mvn clean install --batch-mode --update-snapshots
      env:
        MAVEN_OPTS: '-Xmx2048m -Xms1024m'
    
    # SSR: Verify build artifacts exist before dependency submission (SSR diagnostics)
    - name: Verify build artifacts (SSR diagnostics)
      run: ls -al target/ || echo "No target directory found"
      continue-on-error: true

    # SSR: Upload dependency graph with explicit path to prevent undefined array errors
    # This ensures server-side dependency processing has valid input
    - name: Generate dependency snapshot (SSR path)
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
      with:
        maven-project: ./pom.xml
